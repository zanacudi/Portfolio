<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zana Career Mind Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE  work prep for one person: dense, exact, calm
   IDEA   a geologic cross-section: every branch of the career is a stratum with its own colour
   PICTURE the two-sided mind map, strata-coloured branches wired to each item; strata bar sized by item count
   COLOUR white ground, basalt #1d1b19 header field, eight mineral hues (ochre, water blue, clay, hematite, amethyst, slate, garnet, iron)
   TYPE   Barlow Condensed 600/700 for names and labels, Barlow for text
   LAYOUT laptop: header strip, filter chips, map across the full width; 720px: branch cards in two columns; phone: one column */
:root{color-scheme:light dark;--bg:light-dark(#fff,#141210);--ink:light-dark(#1d1b19,#ece6df);--mute:light-dark(#5f5850,#a9a197);--rule:light-dark(#e3ded7,#312c27);--alt:light-dark(#f6f4f1,#1b1815);--basalt:#1d1b19;--on:light-dark(#fff,#141210);
--c1:light-dark(#a3610a,#e3a54a);--c2:light-dark(#1b5fa8,#6ea8e8);--c3:light-dark(#7d5230,#cf9b6c);--c4:light-dark(#a3362a,#e98272);--c5:light-dark(#64479b,#ae94e3);--c6:light-dark(#3d5166,#a2b6ca);--c7:light-dark(#97234f,#e57fa9);--c8:light-dark(#5b564f,#b9b2a8)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Barlow,"Segoe UI",Roboto,Arial,sans-serif;overflow-x:clip}
h1,h2,h3,.br,.root strong,.seg,.fig b,.fit{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif}
h1{font-size:clamp(34px,5vw,48px);line-height:1.05;letter-spacing:-.01em;margin:0 0 10px;font-weight:700}
h2{font-size:28px;line-height:1.1;margin:0 0 8px;font-weight:700}
h3{font-size:21px;line-height:1.15;margin:0;font-weight:600}
a{color:inherit;text-underline-offset:3px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--c2);outline-offset:2px}
.band{padding-block:clamp(28px,4vw,56px);padding-left:max(5vw,16px,env(safe-area-inset-left,0px));padding-right:max(5vw,16px,env(safe-area-inset-right,0px))}
.band>*{max-width:1240px;margin-inline:auto}
.alt{background:var(--alt)}
.intro{color:var(--mute);margin:0 auto 22px;max-width:1240px}
.scroll{overflow-x:auto}
#gate{position:fixed;inset:0;background:var(--basalt);color:#fff;display:grid;grid-template-rows:1fr auto;z-index:9}
#gate form{align-self:center;justify-self:center;width:min(420px,calc(100% - 32px));display:grid;gap:12px}
#gate h1{color:#fff}
#gate p{margin:0;color:#c9c1b7}
#gate label{font-weight:600}
#gate .row{display:flex;gap:8px;flex-wrap:wrap}
#pw{flex:1 1 200px;font:16px Barlow,Arial,sans-serif;padding:11px 12px;border-radius:8px;border:1px solid #6b635a;background:#2a2622;color:#fff;min-height:46px}
#go{min-height:46px;padding:0 22px;border-radius:8px;border:0;background:#e3a54a;color:#1d1b19;font-weight:600;cursor:pointer}
#go:disabled{opacity:.6}
#err{min-height:1.5em;color:#ffb3a8}
.bars{display:flex;height:22px}
.bars i{flex:1}
#app[hidden]{display:none}
.top{background:var(--basalt);color:#fff}
.hd{padding-left:max(5vw,16px,calc((100% - 1240px)/2));padding-right:max(5vw,16px,calc((100% - 1240px)/2));display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px 40px;align-items:end;padding-bottom:26px}
.hd>*{margin-inline:0}
.lede{font-size:21px;line-height:1.3;margin:0 0 8px;font-weight:500;max-width:34em}
.ctx{margin:0;color:#c9c1b7;max-width:44em}
.tally{display:grid;grid-template-columns:repeat(4,auto);gap:4px 26px}
.fig{display:grid}
.fig b{font-size:46px;line-height:1;font-weight:700}
.fig span{font-size:14px;color:#c9c1b7;white-space:nowrap}
.strata{display:flex;height:40px;max-width:none}
.seg{border:0;background:var(--bc);color:var(--on);font-size:15px;font-weight:600;cursor:pointer;display:grid;place-items:center;overflow:hidden;white-space:nowrap;padding:0 4px}
.seg:hover{filter:brightness(1.12)}
.filters{margin-bottom:26px}
.fl{margin:0 0 8px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:6px 12px;border-radius:999px;border:1px solid var(--rule);background:var(--bg);cursor:pointer;font-size:15px;display:inline-flex;gap:8px;align-items:center}
.chip b{font-weight:600;color:var(--mute);font-variant-numeric:tabular-nums}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed=true] b{color:inherit}
.fnote{margin:12px 0 0;color:var(--mute);min-height:1.55em}
.fnote b{color:var(--ink)}
.map{position:relative;display:grid;gap:26px}
.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.wires path{fill:none;transition:opacity .2s}
.side{display:flex;flex-direction:column;gap:26px}
.root{background:var(--basalt);color:#fff;border-radius:12px;padding:16px 18px;display:grid;gap:2px;border:1px solid light-dark(transparent,#4a433c)}
.root strong{font-size:26px;line-height:1.1}
.root span{font-size:14px;color:#c9c1b7}
.grp{display:flex;flex-direction:column;align-items:flex-start;gap:8px;transition:opacity .2s}
.br{background:var(--bc);color:var(--on);font-size:18px;font-weight:600;line-height:1.15;padding:8px 12px;border-radius:8px;flex:none}
.lvs{display:flex;flex-direction:column;gap:2px;align-self:stretch;border-left:2px solid var(--bc);margin-left:10px;padding-left:14px}
.lf{position:relative;display:block;text-align:left;font-size:15px;line-height:1.3;padding:8px 10px;min-height:40px;border-radius:6px;border:1px solid transparent;background:none;cursor:pointer;transition:opacity .2s,background .15s}
.lf::after{content:"";position:absolute;top:50%;left:-19.5px;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;border:2px solid var(--bc);background:var(--bg)}
.lf.st::after{background:var(--bc)}
.lf:hover{background:color-mix(in srgb,var(--bc) 12%,transparent);border-color:color-mix(in srgb,var(--bc) 45%,transparent)}
.lf.hit{background:color-mix(in srgb,var(--bc) 14%,transparent);border-color:var(--bc)}
.filtering .lf:not(.hit){opacity:.3}
.grp.off{opacity:.45}
@media (min-width:700px) and (max-width:1179px){.map{grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:34px}.root{grid-column:1/-1;grid-row:1}}
@media (min-width:1180px){
.map{grid-template-columns:minmax(0,1fr) 176px minmax(0,1fr);column-gap:52px;align-items:center}
.root{text-align:center;padding:22px 14px;place-items:center}
.grp{flex-direction:row;align-items:center;gap:46px}
#sideL .grp{flex-direction:row-reverse}
.br{width:150px}
#sideL .br{text-align:right}
.lvs{border:0;margin:0;padding:0;flex:1}
#sideL .lvs{align-items:flex-end}
#sideL .lf{text-align:right}
#sideL .lf::after{left:auto;right:-5.5px}
#sideR .lf::after{left:-5.5px}
.lf{min-height:34px;padding:6px 10px}
}
.req{width:100%;border-collapse:collapse}
.req th{text-align:left;font-size:14px;color:var(--mute);font-weight:600;padding:0 14px 10px 0;border-bottom:2px solid var(--ink)}
.req td{padding:14px 14px 14px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.req td:first-child{width:28%}
.req td:nth-child(2){width:96px}
.req td:last-child{width:24%}
.post{display:block;color:var(--mute);font-size:14px;margin-top:2px}
.fit{display:inline-block;font-size:16px;font-weight:600;padding:2px 10px;border-radius:5px;color:var(--on);white-space:nowrap}
.f-Strong{background:var(--c2)}
.f-Partial{background:var(--c1)}
.f-Prepare{background:var(--c4)}
.cards{display:grid;gap:18px}
.card{background:var(--bg);border:1px solid var(--rule);border-radius:10px;padding:20px;scroll-margin-top:16px}
.card header{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;margin-bottom:14px}
.card .who{color:var(--mute);font-size:14px}
.star{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.star h4{margin:0 0 4px;font-size:14px;color:var(--mute);font-weight:600}
.star p{margin:0;font-size:15px}
.add{border:1.5px dashed var(--c1);border-radius:6px;padding:8px 10px;margin-top:8px!important;color:var(--ink)}
.card.flash{outline:3px solid var(--c1)}
.people{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.person{border-top:3px solid var(--ink);padding-top:12px}
.person p{margin:6px 0 0}
.role{color:var(--mute);font-size:14px;margin-top:2px!important}
.qs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 34px;margin-block:0}
.qs dt{font-weight:600}
.qs dd{margin:4px 0 0;color:var(--mute)}
.foot{font-size:14px;color:var(--mute)}
.foot p{margin:0}
.backdrop{position:fixed;inset:0;background:rgba(10,8,6,.35);z-index:4}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(460px,100%);background:var(--bg);border-left:1px solid var(--rule);z-index:5;overflow-y:auto;padding:22px 24px 40px;transform:translateX(102%);transition:transform .25s ease;visibility:hidden}
.drawer.open{transform:none;visibility:visible}
.x{float:right;min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--rule);background:var(--bg);cursor:pointer}
.dbr{margin:8px 0 6px;font-weight:600;color:var(--bc)}
.drawer h3{font-size:26px;margin-bottom:10px;clear:both}
.dsrc{color:var(--mute);font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 18px}
.tags span{font-size:14px;border:1px solid var(--rule);border-radius:999px;padding:3px 10px}
.mini{border-top:2px solid var(--ink);padding-top:12px}
.mini p{margin:6px 0;font-size:15px}
.mini b{color:var(--mute);font-weight:600}
.jump{margin-top:10px;min-height:42px;padding:0 16px;border-radius:8px;border:0;background:var(--ink);color:var(--bg);cursor:pointer;font-weight:600}
@media (max-width:900px){.star{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.people{grid-template-columns:minmax(0,1fr)}.hd{grid-template-columns:minmax(0,1fr)}.tally{grid-template-columns:repeat(4,minmax(0,auto))}}
@media (max-width:600px){
table{font-size:14px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--rule)}.stack td{display:flex;flex-direction:column;gap:2px;border:0;padding:4px 0;width:auto!important}.stack td::before{content:attr(data-l);font-size:13px;color:var(--mute);font-weight:600}
.star,.qs{grid-template-columns:minmax(0,1fr)}
.tally{grid-template-columns:repeat(2,minmax(0,1fr))}
.fig b{font-size:38px}
.seg span{display:none}
.lf{min-height:44px}
.hd>*{margin-inline:0}
.lede{font-size:19px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="gate">
  <form id="gf" autocomplete="off">
    <h1>Zana Taher: career mind map</h1>
    <p>This page is password protected. Its content stays encrypted until the right password is entered.</p>
    <label for="pw">Password</label>
    <div class="row"><input id="pw" type="password" autocomplete="off" spellcheck="false" required><button id="go" type="submit">Open</button></div>
    <p id="err" role="alert"></p>
  </form>
  <div class="bars" aria-hidden="true"><i style="background:#e3a54a"></i><i style="background:#6ea8e8"></i><i style="background:#cf9b6c"></i><i style="background:#e98272"></i><i style="background:#ae94e3"></i><i style="background:#a2b6ca"></i><i style="background:#e57fa9"></i><i style="background:#b9b2a8"></i></div>
</div>
<main id="app" hidden></main>

const $=s=>document.querySelector(s);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
async function decrypt(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.s),iterations:P.n,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.i)},key,b64(P.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
const err=$("#err"),go=$("#go"),pw=$("#pw");
if(!(window.crypto&&crypto.subtle)){err.textContent="This browser cannot decrypt the page. Open it in a current version of Chrome, Edge, Safari or Firefox.";go.disabled=true}
$("#gf").addEventListener("submit",async e=>{
  e.preventDefault();go.disabled=true;err.textContent="";
  let o=null;
  try{o=await decrypt(pw.value)}catch(x){err.textContent="That password did not open the map.";go.disabled=false;pw.select();return}
  $("#gate").remove();const app=$("#app");app.innerHTML=o.html;app.hidden=false;render(o.data);window.scrollTo(0,0);
});
pw.focus();

function render(D){
  const SN={aecom:"Dam work",phd:"PhD",msc:"MSc",civil:"Civil",teach:"Teaching",creds:"Credentials",soft:"Software",award:"Awards"};
  const LBL={S:"Situation",T:"Task",A:"Action",R:"Result"};
  const R=Object.fromEntries(D.reqs.map(r=>[r.id,r]));
  const S=Object.fromEntries(D.stories.map(s=>[s.id,s]));
  const all=[];const byK={};
  D.branches.forEach(b=>b.leaves.forEach((l,i)=>{l.b=b;l.k=b.id+"-"+i;all.push(l);byK[l.k]=l}));
  const cnt=Object.fromEntries(D.reqs.map(r=>[r.id,all.filter(l=>l.g.includes(r.id)).length]));
  const lev=k=>D.reqs.filter(r=>r.s===k).length;
  const sl=id=>`<a href="#${id}" data-go="${id}">${esc(S[id].t)}</a>`;
  let cur=null,last=null;

  $("#lede").textContent=`${lev("Strong")} of ${D.reqs.length} posting requirements are strong matches. Safety and client work need a specific story before 5\u00a0pm.`;
  $("#tally").innerHTML=[[all.length,"items of record"],[lev("Strong"),"strong matches"],[lev("Partial"),"partial"],[lev("Prepare"),"to prepare"]].map(([n,t])=>`<div class="fig"><b>${n}</b><span>${t}</span></div>`).join("");
  $("#strata").innerHTML=D.branches.map(b=>`<button class="seg" type="button" style="--bc:var(--c${b.c});flex:${b.leaves.length}" data-b="${b.id}" title="${esc(b.name)}"><span>${SN[b.id]}</span></button>`).join("");
  const grp=b=>`<div class="grp" id="g-${b.id}" style="--bc:var(--c${b.c})"><div class="br">${esc(b.name)}</div><div class="lvs">${b.leaves.map(l=>`<button type="button" class="lf${l.st?" st":""}" data-k="${l.k}">${esc(l.t)}</button>`).join("")}</div></div>`;
  ["L","R"].forEach(s=>{$("#side"+s).innerHTML=D.branches.filter(b=>b.side===s).map(grp).join("")});
  $("#chips").innerHTML=D.reqs.map(r=>`<button type="button" class="chip" data-r="${r.id}" aria-pressed="false">${esc(r.name)} <b>${cnt[r.id]}</b></button>`).join("");
  $("#reqt").innerHTML=D.reqs.map(r=>`<tr><td data-l="Requirement"><strong>${esc(r.name)}</strong><span class="post">“${esc(r.posting)}”</span></td><td data-l="Fit"><span class="fit f-${r.s}">${r.s}</span></td><td data-l="Best evidence">${esc(r.note)}</td><td data-l="Lead with">${r.st.length?r.st.map(sl).join("<br>"):"No written story yet"}</td></tr>`).join("");
  $("#cards").innerHTML=D.stories.map(s=>`<article class="card" id="${s.id}"><header><h3>${esc(s.t)}</h3><span class="who">For ${esc(s.who)}</span></header><div class="star">${["S","T","A","R"].map(k=>`<div><h4>${LBL[k]}</h4>${s[k]?`<p>${esc(s[k])}</p>`:""}${k==="R"&&s.add?`<p class="add">${esc(s.add)}</p>`:""}</div>`).join("")}</div></article>`).join("");
  $("#people").innerHTML=D.people.map(p=>`<div class="person"><h3>${esc(p.n)}</h3><p class="role">${esc(p.r)}</p><p><b>Likely listening for:</b> ${esc(p.p)}</p><p><b>Lead with:</b> ${p.st.map(sl).join("; ")}</p></div>`).join("");
  $("#qs").innerHTML=D.qs.map(q=>`<div><dt>${esc(q.q)}</dt><dd>${esc(q.a)}</dd></div>`).join("");

  const map=$("#map"),svg=$("#wires"),root=$("#root"),fnote=$("#fnote");
  const DEF="Click any item for details. A solid dot means the item has a STAR story below.";
  fnote.textContent=DEF;
  const wide=matchMedia("(min-width:1180px)");
  const path=(x1,y1,x2,y2,w,c,dim)=>{const xm=(x1+x2)/2;return `<path d="M${x1.toFixed(1)} ${y1.toFixed(1)}C${xm.toFixed(1)} ${y1.toFixed(1)} ${xm.toFixed(1)} ${y2.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}" style="stroke:${c};stroke-width:${w}px;opacity:${dim?.18:.9}"/>`};
  function wires(){
    if(!wide.matches){svg.innerHTML="";return}
    const m=map.getBoundingClientRect(),rr=root.getBoundingClientRect();let h="";
    map.querySelectorAll(".grp").forEach(g=>{
      const L=g.parentNode.id==="sideL",c=g.style.getPropertyValue("--bc"),br=g.querySelector(".br").getBoundingClientRect();
      const y0=rr.top+rr.height/2-m.top,yb=br.top+br.height/2-m.top;
      h+=path((L?rr.left:rr.right)-m.left,y0,(L?br.right:br.left)-m.left,yb,3,c,cur&&g.classList.contains("off"));
      const bx=(L?br.left:br.right)-m.left;
      g.querySelectorAll(".lf").forEach(el=>{const r=el.getBoundingClientRect();h+=path(bx,yb,(L?r.right:r.left)-m.left,r.top+r.height/2-m.top,1.6,c,cur&&!el.classList.contains("hit"))});
    });
    svg.innerHTML=h;
  }
  new ResizeObserver(wires).observe(map);
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(wires);
  wide.addEventListener?.("change",wires);

  function filter(id){
    cur=cur===id?null:id;
    document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",String(c.dataset.r===cur)));
    map.classList.toggle("filtering",!!cur);
    map.querySelectorAll(".lf").forEach(el=>el.classList.toggle("hit",!!cur&&byK[el.dataset.k].g.includes(cur)));
    map.querySelectorAll(".grp").forEach(g=>g.classList.toggle("off",!!cur&&!g.querySelector(".hit")));
    if(cur){const r=R[cur];fnote.innerHTML=`<b>${cnt[cur]} items</b> support “${esc(r.posting)}”. Fit: ${r.s}.${r.st.length?" Lead with "+r.st.map(sl).join(" or ")+".":""}`}else fnote.textContent=DEF;
    wires();
  }
  const drawer=$("#drawer"),bd=$("#backdrop");
  function openLeaf(l,el){
    last=el;drawer.style.setProperty("--bc",`var(--c${l.b.c})`);
    $("#dbr").textContent=l.b.name;$("#dt").textContent=l.t;$("#dd").textContent=l.d;$("#dsrc").textContent="Source: "+l.src;
    $("#dreq").innerHTML=l.g.length?`<p class="dsrc">Supports these lines of the posting</p><div class="tags">${l.g.map(g=>`<span>${esc(R[g].name)}</span>`).join("")}</div>`:"";
    const s=l.st&&S[l.st];
    $("#dstory").innerHTML=s?`<div class="mini"><h3 style="font-size:21px">${esc(s.t)}</h3>${["S","T","A","R"].filter(k=>s[k]).map(k=>`<p><b>${LBL[k]}.</b> ${esc(s[k])}</p>`).join("")}${s.add?`<p class="add">${esc(s.add)}</p>`:""}<button type="button" class="jump" data-go="${s.id}">Go to this story</button></div>`:"";
    drawer.classList.add("open");drawer.setAttribute("aria-hidden","false");bd.hidden=false;$("#dx").focus();
  }
  function closeD(){drawer.classList.remove("open");drawer.setAttribute("aria-hidden","true");bd.hidden=true;if(last)last.focus({preventScroll:true})}
  function goStory(id){closeD();const c=document.getElementById(id);if(!c)return;c.scrollIntoView({behavior:"smooth",block:"start"});c.classList.add("flash");setTimeout(()=>c.classList.remove("flash"),1600)}
  document.addEventListener("click",e=>{
    const t=e.target.closest("[data-go],.lf,.chip,.seg");if(!t)return;
    if(t.dataset.go){e.preventDefault();goStory(t.dataset.go)}
    else if(t.classList.contains("lf"))openLeaf(byK[t.dataset.k],t);
    else if(t.classList.contains("chip"))filter(t.dataset.r);
    else if(t.classList.contains("seg")){const g=document.getElementById("g-"+t.dataset.b);g.scrollIntoView({behavior:"smooth",block:"center"});g.querySelector(".br").animate?.([{transform:"scale(1.08)"},{transform:"none"}],{duration:500})}
  });
  $("#dx").addEventListener("click",closeD);bd.addEventListener("click",closeD);
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&drawer.classList.contains("open"))closeD()});
  wires();
}
}
</script>
